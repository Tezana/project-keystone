<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Keystone Tracker</title>
<meta name="description" content="A working project tracker built on GitHub, demoed with a fictional 60-participant research study. Open tasks, mark them done, add notes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#0F172A; --muted:#475569; --faint:#64748B;
  --line:#E2E8F0; --track:#E2E8F0; --accent:#0F766E; --accent-soft:#E6F2F1;
  --done:#334155; --late:#B45309; --late-soft:#FEF3E2; --focus:#0EA5E9; --danger:#B91C1C;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B1220; --card:#111A2B; --ink:#E5EAF2; --muted:#A3B0C2; --faint:#8593A8;
    --line:#22304A; --track:#22304A; --accent:#2DB3A3; --accent-soft:#12302E;
    --done:#94A3B8; --late:#F0A04B; --late-soft:#33240F; --danger:#F87171;
  }
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:24px 20px 64px}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.banner{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:20px;font-size:14px}
.banner.owner{background:var(--late-soft)}
.banner b{font-weight:600}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px;padding:6px 4px}
.linkbtn:hover{text-decoration:underline}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
h1{margin:4px 0 0;font-size:34px;line-height:1.1;letter-spacing:-.01em}
h1 a{color:inherit;text-decoration:none}
.updated{font-size:14px;color:var(--muted)}
nav{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:500;text-decoration:none;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger)}
.btn[aria-current="page"]{border-color:var(--ink)}
.btn:disabled{opacity:.6;cursor:wait}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:28px}
.stat{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-start;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;transition:border-color .15s,transform .15s}
.stat:hover{border-color:var(--accent);transform:translateY(-1px)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.stat .go{margin-top:auto;padding-top:10px;font-size:13px;font-weight:600;color:var(--accent)}
.stat:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:30px;font-weight:700;margin-top:4px;line-height:1.1}
.stat .s{font-size:13px;color:var(--faint);margin-top:4px}
.bar{height:10px;border-radius:5px;background:var(--track);overflow:hidden}
.bar>span{display:block;height:100%;border-radius:5px;background:var(--accent)}

h2{font-size:15px;font-family:"IBM Plex Mono",monospace;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:32px}
.phase{all:unset;box-sizing:border-box;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.phase:hover{border-color:var(--accent)}
.phase[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.phase .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.phase .name{font-weight:600;font-size:16px}
.phase .due{font-size:13px;color:var(--muted)}
.phase .count{font-size:13px;color:var(--muted);display:flex;justify-content:space-between}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.st-Complete,.st-Done{background:var(--track);color:var(--done)}
.st-In,.st-Open{background:var(--accent-soft);color:var(--accent)}
.st-Not{background:transparent;color:var(--faint);border:1px solid var(--line)}
.st-Past{background:var(--late-soft);color:var(--late)}
.st-Won{background:transparent;color:var(--faint);border:1px dashed var(--line)}
.phase.is-late .bar>span{background:var(--late)}
.phase.is-done .bar>span{background:var(--done)}

.main{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.tasks{flex:999 1 560px;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:14px}
.side{flex:1 1 300px;display:flex;flex-direction:column;gap:20px;min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.filterbar{background:var(--accent-soft);border-radius:14px 14px 0 0;font-size:15px}
#taskSection{scroll-margin-top:16px}
#taskSection:focus{outline:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:0 14px;min-height:40px;display:flex;align-items:center;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
select,input[type=search],input[type=text],input[type=password],input[type=date],textarea{font:inherit;font-size:15px;min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
.toolbar select{width:auto}
.toolbar input[type=search]{flex:1 1 160px;min-width:0;width:auto}
.list{list-style:none;margin:0;padding:0}
.item{display:block;text-decoration:none;color:inherit;padding:14px 16px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--bg)}
.item:last-child{border-bottom:0}
.row{display:flex;gap:12px;align-items:flex-start}
.check{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--faint);margin-top:2px;display:flex;align-items:center;justify-content:center}
.done .check{background:var(--accent);border-color:var(--accent)}
.done .title{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.title{font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center;font-size:13px;color:var(--faint)}
.lbl{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.lbl i{width:8px;height:8px;border-radius:50%;display:inline-block}
.body{font-size:14px;color:var(--muted);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chev{margin-left:auto;flex:none;color:var(--faint);font-size:20px;line-height:1}
.empty{padding:28px 16px;color:var(--muted);text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel ol,.panel ul{margin:0;padding-left:20px}
.panel li{margin:6px 0;font-size:15px}
.panel a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.panel a:hover{color:var(--accent);border-color:var(--accent)}
.panel .sub{font-size:13px;color:var(--muted);margin:-6px 0 10px}

/* Task detail + forms */
.back{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:500;margin-bottom:14px;min-height:44px}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.sheet h2.t{font-family:inherit;text-transform:none;letter-spacing:0;font-size:26px;color:var(--ink);font-weight:700;margin:6px 0 10px;line-height:1.2}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted);margin-bottom:18px}
.facts b{color:var(--ink);font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.desc{white-space:pre-wrap;font-size:16px;margin:0 0 8px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:20px;align-items:start}
.notes{list-style:none;margin:0 0 14px;padding:0;border-left:2px solid var(--line)}
.notes li{position:relative;padding:0 0 14px 16px}
.notes li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.notes .when{font-size:12px;color:var(--faint)}
.notes .txt{white-space:pre-wrap;font-size:15px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field label,.field legend{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--faint)}
fieldset{border:0;margin:0 0 16px;padding:0}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500;cursor:pointer;min-height:40px}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.error{color:var(--danger);font-size:14px;margin:8px 0 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);z-index:10}

/* About */
.prose{max-width:760px}
.prose p,.prose li{font-size:16px}
.prose h3{font-size:18px;margin:26px 0 8px}
.flow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0 6px}
.flow .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.flow .box b{display:block;font-size:14px}
.flow .box span{color:var(--muted);font-size:13px}
.flow .box.key{border-color:var(--accent);background:var(--accent-soft)}
.flow .arr{color:var(--faint)}
table.simple{width:100%;border-collapse:collapse;font-size:15px;margin:8px 0}
table.simple th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
table.simple td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.byline{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}
code{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--bg);padding:1px 5px;border-radius:5px}
footer{margin-top:40px;font-size:13px;color:var(--faint);display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between}

@media (max-width:820px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.phases{grid-template-columns:repeat(1,minmax(0,1fr))}h1{font-size:28px}.grid2{grid-template-columns:1fr}.sheet{padding:18px}}
@media (min-width:821px) and (max-width:1000px){.phases{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body>
<div class="wrap">
  <div class="banner" id="banner" role="status"></div>
  <header>
    <div>
      <div class="eyebrow" id="company">Lanternfield Labs</div>
      <h1><a href="#/" id="project">Project Keystone</a></h1>
      <div class="updated" id="summary"></div>
      <div class="updated" id="updated">Loading…</div>
    </div>
    <nav aria-label="Main">
      <a class="btn" href="#/" data-nav="home">Dashboard</a>
      <a class="btn" href="#/about" data-nav="about">About this build</a>
      <a class="btn primary" href="#/new" data-nav="new">+ New task</a>
    </nav>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer>
    <span id="footName">Project Keystone · Lanternfield Labs</span>
    <span>Built by Tezana White · <a href="#/owner">Owner sign-in</a></span>
  </footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  "use strict";
  // ---------- Settings ----------
  var REPO = "Tezana/project-keystone";
  var PORTFOLIO = "https://tezana.github.io/";
  var LINKEDIN = ""; // add your LinkedIn URL here to show it on the About page
  var API = "https://api.github.com";
  var DEMO_KEY = "keystone-demo-v1", TOKEN_KEY = "keystone-owner-token";
  var DUE_RE = /\n?<!-- keystone:due=(\d{4}-\d{2}-\d{2}) -->/;

  // ---------- Small helpers ----------
  function $(id){ return document.getElementById(id); }
  function el(tag, attrs, kids){
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function(k){
      var v = attrs[k]; if (v === null || v === undefined || v === false) return;
      if (k === "text") n.textContent = v;
      else if (k === "class") n.className = v;
      else if (k.slice(0,2) === "on") n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    });
    (kids || []).forEach(function(c){ if (c) n.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });
    return n;
  }
  function store(key, val){ try { if (val === undefined) return JSON.parse(localStorage.getItem(key) || "null"); if (val === null) localStorage.removeItem(key); else localStorage.setItem(key, JSON.stringify(val)); } catch(e){ return null; } }
  function niceDate(iso){
    if (!iso) return "";
    var p = iso.slice(0,10).split("-").map(Number);
    return new Date(p[0], p[1]-1, p[2]).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function today(){ var d = new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
  function daysUntil(iso){ var p = iso.split("-").map(Number); var due = new Date(p[0], p[1]-1, p[2]); var now = new Date(); now.setHours(0,0,0,0); return Math.round((due - now) / 864e5); }
  function phaseNum(t){ var m = /Phase (\d+)/.exec(t || ""); return m ? +m[1] : 99; }
  function shortPhase(t){ return ((t || "").split(":")[1] || t || "No phase").trim(); }
  function splitBody(body){ var m = DUE_RE.exec(body || ""); return { text: (body || "").replace(DUE_RE, "").trim(), due: m ? m[1] : "" }; }
  function joinBody(text, due){ return (text || "").trim() + (due ? "\n\n<!-- keystone:due=" + due + " -->" : ""); }
  function toast(msg){ var t = $("toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(function(){ t.hidden = true; }, 2600); }

  // ---------- State ----------
  var S = { base: null, tasks: [], phases: [], labels: {}, milestones: {}, owner: !!store(TOKEN_KEY), ui: { show: "open", phase: "", label: "", q: "", card: "" } };

  // ---------- GitHub API (owner mode) ----------
  function gh(method, path, body){
    return fetch(API + "/repos/" + REPO + path, {
      method: method,
      headers: { "Authorization": "Bearer " + store(TOKEN_KEY), "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined
    }).then(function(r){
      if (r.status === 401) { store(TOKEN_KEY, null); S.owner = false; throw new Error("Your key was rejected. Owner mode is off."); }
      if (!r.ok) return r.json().catch(function(){ return {}; }).then(function(j){ throw new Error(j.message || ("GitHub error " + r.status)); });
      return r.status === 204 ? null : r.json();
    });
  }
  function ghAll(path){
    var out = [];
    function page(n){ return gh("GET", path + (path.indexOf("?") > -1 ? "&" : "?") + "per_page=100&page=" + n).then(function(b){ out = out.concat(b); return b.length === 100 ? page(n+1) : out; }); }
    return page(1);
  }
  function fromIssue(i){
    var b = splitBody(i.body);
    return { number: i.number, title: i.title, state: i.state, reason: i.state_reason || "", phase: i.milestone ? i.milestone.title : "", labels: i.labels.map(function(l){ return l.name; }), body: b.text, due: b.due, closed: (i.closed_at || "").slice(0,10), created: (i.created_at || "").slice(0,10), comments: i.comments || 0 };
  }

  // ---------- Demo overlay (visitor's browser only) ----------
  function demo(){ return store(DEMO_KEY) || { edits: {}, created: [], notes: {}, next: 0 }; }
  function saveDemo(d){ store(DEMO_KEY, d); }
  function applyDemo(tasks){
    var d = demo();
    var merged = tasks.map(function(t){ return Object.assign({}, t, d.edits[t.number] || {}); });
    return merged.concat(d.created.map(function(t){ return Object.assign({}, t, d.edits[t.number] || {}); }));
  }

  // ---------- Load ----------
  function load(){
    return fetch("data.json?t=" + Date.now(), { cache: "no-store" }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }).then(function(base){
      S.base = base; S.labels = base.labels;
      var dueByPhase = {}; base.phases.forEach(function(p){ dueByPhase[p.title] = p.due; });
      S.phases = base.phases.map(function(p){ return { title: p.title, due: p.due }; });
      if (S.owner){
        return Promise.all([ghAll("/issues?state=all"), ghAll("/milestones?state=all")]).then(function(res){
          var issues = res[0].filter(function(i){ return !i.pull_request; });
          S.milestones = {}; res[1].forEach(function(m){ S.milestones[m.title] = m.number; dueByPhase[m.title] = (m.due_on || "").slice(0,10); });
          S.phases = Object.keys(dueByPhase).map(function(t){ return { title: t, due: dueByPhase[t] }; });
          S.tasks = issues.map(fromIssue);
        }).catch(function(e){ S.owner = false; toast(e.message); S.tasks = applyDemo(base.tasks.map(baseTask)); });
      }
      S.tasks = applyDemo(base.tasks.map(baseTask));
    });
  }
  function baseTask(t){ var b = splitBody(t.body); return { number: t.number, title: t.title, state: t.state, reason: t.reason || "", phase: t.phase, labels: t.labels, body: b.text, due: b.due, closed: t.closed, created: t.created || "" }; }

  function phaseStats(){
    var live = S.tasks.filter(function(t){ return t.reason !== "not_planned"; });
    return S.phases.slice().sort(function(a,b){ return phaseNum(a.title) - phaseNum(b.title); }).map(function(p){
      var mine = live.filter(function(t){ return t.phase === p.title; });
      var done = mine.filter(function(t){ return t.state === "closed"; }).length;
      var status = mine.length && done === mine.length ? "Complete" : (p.due && daysUntil(p.due) < 0) ? "Past due" : done ? "In progress" : "Not started";
      return { title: p.title, due: p.due, total: mine.length, done: done, status: status };
    });
  }
  function find(n){ return S.tasks.filter(function(t){ return String(t.number) === String(n); })[0]; }

  // ---------- Write actions (owner → GitHub, demo → this browser) ----------
  function saveTask(n, changes){
    var t = find(n);
    if (S.owner){
      var payload = {};
      if ("title" in changes) payload.title = changes.title;
      if ("body" in changes || "due" in changes) payload.body = joinBody("body" in changes ? changes.body : t.body, "due" in changes ? changes.due : t.due);
      if ("labels" in changes) payload.labels = changes.labels;
      if ("phase" in changes) payload.milestone = S.milestones[changes.phase] || null;
      if ("state" in changes){ payload.state = changes.state; if (changes.state === "closed") payload.state_reason = changes.reason || "completed"; }
      return gh("PATCH", "/issues/" + n, payload).then(function(i){ Object.assign(t, fromIssue(i)); });
    }
    var d = demo(); d.edits[n] = Object.assign(d.edits[n] || {}, changes);
    if (changes.state === "closed") d.edits[n].closed = today();
    saveDemo(d); Object.assign(t, changes); if (changes.state === "closed") t.closed = today();
    return Promise.resolve();
  }
  function createTask(f){
    if (S.owner){
      return gh("POST", "/issues", { title: f.title, body: joinBody(f.body, f.due), labels: f.labels, milestone: S.milestones[f.phase] || undefined })
        .then(function(i){ var t = fromIssue(i); S.tasks.push(t); return t.number; });
    }
    var d = demo(); var maxN = S.tasks.reduce(function(m,t){ return Math.max(m, +t.number || 0); }, 0);
    var n = Math.max(maxN, d.next || 0) + 1; d.next = n;
    var t = { number: n, title: f.title, state: "open", reason: "", phase: f.phase, labels: f.labels, body: f.body, due: f.due, closed: "", created: today(), demo: true };
    d.created.push(t); saveDemo(d); S.tasks.push(Object.assign({}, t));
    return Promise.resolve(n);
  }
  function loadNotes(n){
    if (S.owner) return ghAll("/issues/" + n + "/comments").then(function(cs){ return cs.map(function(c){ return { text: c.body, at: c.created_at.slice(0,10) }; }); });
    return Promise.resolve((demo().notes[n] || []).slice());
  }
  function addNote(n, text){
    if (S.owner) return gh("POST", "/issues/" + n + "/comments", { body: text });

      fetch(API + "/repos/" + REPO, { headers: { "Authorization": "Bearer " + v, "Accept": "application/vnd.github+json" } })
        .then(function(r){ if (!r.ok) throw new Error("That key didn't work (GitHub said " + r.status + ")."); return r.json(); })
        .then(function(repo){ if (!repo.permissions || !repo.permissions.push) throw new Error("That key can read the repo but can't change it. Give it Issues: Read and write."); store(TOKEN_KEY, v); S.owner = true; boot("Owner mode on. Changes now save to GitHub."); location.hash = "#/"; })
        .catch(function(ex){ err.textContent = ex.message; err.hidden = false; go.disabled = false; go.textContent = "Unlock owner mode"; });
    } }, [el("div", { class: "field" }, [el("label", { for: "key", text: "Your private key" }), key, el("span", { class: "hint", text: "Stored only in this browser. Never share it." })]), el("div", { class: "actions" }, [go]), err]);
    mount([
      el("a", { class: "back", href: "#/", text: "← Back to dashboard" }),
      el("div", { class: "sheet prose" }, S.owner ? [
        el("h2", { class: "t", text: "Owner mode is on" }), el("p", { text: "Changes on this device save to GitHub." }),
        el("button", { type: "button", class: "btn", text: "Lock owner mode", onclick: function(){ store(TOKEN_KEY, null); S.owner = false; boot("Owner mode locked."); location.hash = "#/"; } })
      ] : [
        el("div", { class: "eyebrow", text: "For the project owner" }),
        el("h2", { class: "t", text: "Owner sign-in" }),
        el("p", { text: "Visitors use the demo. To save real changes to GitHub, unlock with a private key that only you have." }),
        form,
        el("h3", { text: "Make a key (one time, about 2 minutes)" }),
        el("ol", {}, [
          el("li", {}, ["On GitHub, open ", el("a", { href: "https://github.com/settings/personal-access-tokens/new", target: "_blank", rel: "noopener", text: "new fine-grained token" }), "."]),
          el("li", { text: "Name it \"Keystone tracker\" and pick an expiration date." }),
          el("li", { text: "Repository access: Only select repositories → project-keystone." }),
          el("li", { text: "Permissions → Repository permissions → Issues: Read and write. Leave everything else as is." }),
          el("li", { text: "Click Generate token, copy it, and paste it above." })
        ])
      ])
    ], "Owner sign-in");
  }

  // ---------- Router ----------
  function route(){
    var h = location.hash.replace(/^#\/?/, "");
    var m = /^task\/(\d+)/.exec(h);
    if (m) viewTask(m[1]);
    else if (h === "new") viewNew();
    else if (h === "about") viewAbout();
    else if (h === "owner") viewOwner();
    else viewHome();
    window.scrollTo(0, 0);
  }
  function boot(msg){
    banner();
    return load().then(function(){
      var b = S.base;
      $("project").textContent = b.project; $("company").textContent = b.company; $("summary").textContent = b.summary || "";
      $("footName").textContent = b.project + " · " + b.company;
      $("updated").textContent = S.owner ? "Live from GitHub" : "Data updated " + niceDate(b.updated);
      banner(); route(); if (msg) toast(msg);
    }).catch(function(){ $("updated").textContent = "Couldn't load tasks. Refresh in a minute."; });
  }
  window.addEventListener("hashchange", route);
  boot();
})();
</script>
</body>
</html>
